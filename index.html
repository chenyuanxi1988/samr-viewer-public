<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="反垄断数据库 — 海华永泰律师事务所 陈元熹律师团队倾力打造，全量收录国家市场监督管理总局及各省市反垄断执法、简易案件、行政处罚信息">
    <meta name="format-detection" content="telephone=no">
    <title>反垄断数据库 | 海华永泰 陈元熹律师</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">⚖️</span>
                <div class="logo-text">
                    <h1>反垄断数据库</h1>
                    <p class="subtitle">海华永泰 · 陈元熹律师</p>
                </div>
            </div>
            <div class="header-badge">
                <span class="lawyer-tag">合规与反垄断业务团队</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        <!-- 紧凑型统计概览条 (桌面1行4列，移动端2x2) -->
        <section class="stats-section" id="stats-section">
            <div class="stats-grid">
                <div class="stat-card stat-total-card">
                    <div class="stat-number" id="stat-total">—</div>
                    <div class="stat-label">
                        <span>案件总数</span>
                        <span class="stat-updated-tag">更新于 <span id="stat-updated">—</span></span>
                    </div>
                </div>
                <div class="stat-card stat-cat-jyaj">
                    <div class="stat-number" id="stat-jyaj">—</div>
                    <div class="stat-label">简易案件公示</div>
                </div>
                <div class="stat-card stat-cat-xzcf">
                    <div class="stat-number" id="stat-xzcf">—</div>
                    <div class="stat-label">行政处罚决定</div>
                </div>
                <div class="stat-card stat-cat-ftj">
                    <div class="stat-number" id="stat-ftj">—</div>
                    <div class="stat-label">附条件批准/禁止</div>
                </div>
            </div>

            <!-- 省份快捷胶囊筛选与图表折叠区 -->
            <div class="province-bar-wrapper">
                <div class="province-header-row">
                    <span class="province-header-title">🏛️ 地区分布 (点击快捷筛选):</span>
                    <button class="toggle-chart-btn" id="toggle-chart-btn" type="button">
                        <span id="chart-btn-text">查看图表 ▾</span>
                    </button>
                </div>
                <div class="province-chips" id="province-chips">
                    <!-- 由 app.js 动态填充 -->
                </div>
                <div class="province-chart-drawer" id="province-chart-drawer" style="display: none;">
                    <div class="province-chart" id="province-chart">
                        <div class="chart-bars" id="chart-bars"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 搜索与筛选工具栏 (桌面单行横排，移动端自适应) -->
        <section class="search-section">
            <div class="search-filter-row">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="输入企业名称、案由等搜索案件…" autocomplete="off">
                    <button class="clear-btn" id="clear-btn" title="清除搜索">✕</button>
                </div>
                <div class="filter-controls">
                    <select id="filter-province" class="filter-select">
                        <option value="">全部省份</option>
                    </select>
                    <select id="filter-category" class="filter-select">
                        <option value="">全部类型</option>
                    </select>
                    <button class="reset-filter-btn" id="reset-filter-btn" title="重置全部筛选">重置</button>
                </div>
            </div>
            <div class="result-count" id="result-count"></div>
        </section>

        <!-- 案件列表 (桌面自适应双列，移动端单列) -->
        <section class="case-list-section">
            <div class="case-list" id="case-list">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>加载案件数据中…</p>
                </div>
            </div>
        </section>

        <!-- 分页器 -->
        <div class="pagination" id="pagination"></div>

        <!-- 专业服务与完整数据库 Banner -->
        <section class="upsell-banner">
            <div class="upsell-content">
                <span class="upsell-icon">⚖️</span>
                <p><strong>海华永泰律师事务所 · 反垄断与竞争法专业团队</strong></p>
                <p class="upsell-desc">本公开版收录案件公示速览；完整内网系统支持 Word/PDF 处罚决定书全文解析、附件下载与多维检索</p>
                <p class="upsell-contact">陈元熹律师团队业务咨询与数据合作交流，欢迎联系关注</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>数据来源：国家市场监督管理总局及各省级市场监管局公开信息</p>
        <p class="footer-disclaimer">反垄断数据库 · 海华永泰律师事务所 陈元熹律师 | 本工具仅供反垄断与竞争法学术及合规研究参考</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
